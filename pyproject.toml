[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clearact-lite"
version = "0.1.0"
description = "Local-first model-directed runtime with inspectable history."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1", "jsonschema>=4.20,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "mcp>=1.27,<2", "playwright>=1.51,<2", "python-multipart>=0.0.18,<1",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
ui-test = ["playwright>=1.51,<2", "psutil>=5.9,<8"]

[project.scripts]
clearact-lite = "clearact_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clearact_lite = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src", "development/scripts"]
testpaths = ["development/tests"]
cache_dir = "development/.cache/pytest"

[tool.ruff]
line-length = 120
target-version = "py312"
cache-dir = "development/.cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
